<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1522">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Senda Ninja">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Senda Ninja</title>
<style>
:root{--sat:max(env(safe-area-inset-top,0px),var(--natT,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--natB,0px))}
:root{--bg:#0f1522;--panel:#182033;--panel2:#212b44;--ink:#f4ecd8;--mut:#9aa6bd;--acc:#e8553a;--gold:#ffcf4a;--ok:#4cc764;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0f18;color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;font-size:15px;touch-action:none;overscroll-behavior:none}
input{-webkit-user-select:text;user-select:text}
#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.hide{display:none!important}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;margin:0;outline:none}

/* ---------- pantallas ---------- */
#ui{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:8}
.screen{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;pointer-events:auto;
  padding:18px 16px 22px;overflow-y:auto;touch-action:pan-y}
.screen.dim{background:rgba(9,13,22,.86)}
.rh{display:flex;align-items:center;justify-content:space-between}
.rf{width:34px;height:30px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:16px;font-weight:900}
.rooms{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}
.room{display:flex;align-items:center;gap:8px;justify-content:space-between;background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px}
.room b{display:block;font-size:14px}
.room small{display:block;font-size:11.5px;color:#aab3c5;margin-top:1px}
.room .btn{width:auto;margin:0;padding:8px 14px;flex:none}
.rnone{font-size:12.5px;color:#aab3c5;padding:6px 2px}
/* fin de partida: el campo queda a la vista para celebrar; solo la tarjeta de arriba y los paneles reciben toques */
.screen.party{pointer-events:none;padding:calc(8px + var(--sat)) 10px 0;overflow:hidden}
.endTop{pointer-events:auto;width:100%;max-width:420px;background:rgba(13,18,30,.88);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:8px 10px 10px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.endTop .et{font-size:30px;font-weight:900;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.endTop .es{font-size:12px;font-weight:700;color:#d9dfeb;margin:3px 0 8px}
.etabs{display:flex;gap:6px}
.etabs button{flex:1;padding:8px 2px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;font-weight:800;font-size:12.5px}
.etabs button.on{background:var(--gold);color:#2a1a05;border-color:var(--gold)}
.eacts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;justify-content:center}
.eacts .btn{flex:1;min-width:84px;margin:0;padding:8px 6px;font-size:12.5px}
.ehint{margin-top:8px;font-size:12px;font-weight:800;background:rgba(13,18,30,.75);border-radius:999px;padding:5px 12px;text-shadow:0 1px 2px #000}
.endPanel{pointer-events:auto;position:absolute;left:8px;right:8px;top:calc(196px + var(--sat));bottom:calc(8px + var(--sab));background:rgba(9,13,22,.95);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:10px;overflow:auto;touch-action:pan-x pan-y}
.endPanel .eclose{width:auto;margin:0 0 8px;padding:7px 12px}
.enote{font-size:11.5px;color:#aab3c5;margin:0 2px 8px;line-height:1.35}
.etbl{overflow:auto;border-radius:10px}
.etbl table{border-collapse:separate;border-spacing:0;font-size:12px}
.etbl th,.etbl td{padding:6px 8px;text-align:center;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.07)}
.etbl th{font-size:10.5px;color:#aab3c5;font-weight:800;position:sticky;top:0;background:#141b2b;z-index:1;max-width:72px;white-space:normal;line-height:1.15}
.etbl th.on,.etbl td.on{color:var(--gold);font-weight:900}
.etbl .nm{position:sticky;left:0;background:#111827;text-align:left;z-index:2;min-width:96px}
.etbl td.nm small{display:block;font-size:10px;color:#8a93a6;font-weight:700}
.etbl tr.me td{background:rgba(255,207,74,.08)}
.etbl tr.me td.nm{background:#2a2614}
.emvp{display:grid;grid-template-columns:1fr;gap:7px}
.mv{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px}
.mv .mi{font-size:26px;width:34px;text-align:center}
.mv small{display:block;font-size:10.5px;color:#aab3c5;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.mv b{display:block;font-size:15px}
.mv span{display:block;font-size:11.5px;color:#cfd6e6}
body.party #top, body.party #obj, body.party #feed, body.party #me, body.party #banner, body.party #bKill, body.party #bShur, body.party #count, body.party #downed, body.party #bRefall, body.party #edge{display:none!important}
body.party #bSpec svg, body.party #bSpec em, body.party #bSpec::after{display:none}
body.party #bSpec::before{content:'🎆';background:none;position:relative;left:auto;top:auto;width:auto;height:auto;font-size:30px;line-height:1;z-index:1}
body.party #bSpec{display:flex;align-items:center;justify-content:center;border-color:#ffd76a}
.screen.title{justify-content:space-between;background:linear-gradient(180deg,rgba(9,13,22,.78) 0%,rgba(9,13,22,.1) 34%,rgba(9,13,22,.15) 55%,rgba(9,13,22,.92) 100%)}
.logo{text-align:center;margin-top:7vh}
.logo .k{font-size:13px;letter-spacing:.42em;color:var(--gold);font-weight:700;margin-left:.42em}
.logo h1{margin:6px 0 0;font-size:50px;line-height:.95;font-weight:900;letter-spacing:.02em;color:#fff7e6;
  text-shadow:0 3px 0 #a3321f,0 6px 18px rgba(0,0,0,.6)}
.logo h1 span{display:block;color:var(--acc);text-shadow:0 3px 0 #5d1a10,0 6px 18px rgba(0,0,0,.6)}
.logo p{margin:12px 0 0;color:var(--ink);font-size:15px;opacity:.9}
.stack{width:100%;max-width:360px}
.btn{display:block;width:100%;height:54px;border-radius:14px;font-size:17px;font-weight:800;letter-spacing:.02em;margin-top:10px;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink);pointer-events:auto}
.btn:active{transform:translateY(1px);filter:brightness(1.15)}
.btn.pri{background:linear-gradient(180deg,#f0664a,#d7432a);border-color:#ff9a84;color:#fff;box-shadow:0 4px 0 #8e2a19}
.btn.gold{background:linear-gradient(180deg,#ffd964,#f0b429);border-color:#ffe9a8;color:#3a2a05;box-shadow:0 4px 0 #a37410}
.btn.sm{height:44px;font-size:15px;font-weight:700}
.btn[disabled]{opacity:.45}
.row{display:flex;width:100%}
.row>*{flex:1;margin-left:8px}.row>*:first-child{margin-left:0}
.panel{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:10px}
h2{margin:4px 0 2px;font-size:22px;font-weight:900;text-align:center}
h3{margin:14px 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:800}
.sub{color:var(--mut);font-size:13.5px;text-align:center;margin:2px 0 6px;line-height:1.35}
.back{position:absolute;left:10px;top:10px;width:44px;height:44px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:22px;font-weight:800;pointer-events:auto;z-index:2}
.cards{display:flex}
.card{flex:1;margin-left:8px;background:var(--panel2);border:2px solid transparent;border-radius:14px;padding:10px 6px;text-align:center;pointer-events:auto}
.card:first-child{margin-left:0}
.card.on{border-color:var(--gold);background:#2a3654}
.card svg{width:34px;height:34px}
.card b{display:block;font-size:15px;margin-top:2px}
.card i{display:block;font-style:normal;font-size:11.5px;color:var(--mut)}
.cards.pairs{flex-wrap:wrap;align-items:center}
.cards.pairs .card.sm{flex:none;width:calc(50% - 14px);margin:3px 0;display:flex;align-items:center;text-align:left;padding:6px 8px}
.cards.pairs .card.sm svg{width:24px;height:24px;flex:none;margin-right:7px}
.cards.pairs .card.sm b{font-size:14px;margin:0}.cards.pairs .card.sm i{font-size:11px;margin-left:auto}
.cards.pairs .yy{width:28px;text-align:center;color:var(--mut);font-size:15px}
.note{font-size:13px;color:var(--ink);opacity:.86;line-height:1.35;min-height:36px;margin:8px 2px 0;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:1 1 auto;min-width:calc(25% - 6px);padding:0 6px;white-space:nowrap;margin-left:0;height:40px;border-radius:11px;background:var(--panel2);border:2px solid transparent;font-size:14px;font-weight:700;pointer-events:auto}
.chip:first-child{margin-left:0}.chip.on{border-color:var(--gold);background:#2a3654}
.field{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:#0e1422;color:var(--ink);font-size:18px;font-weight:700;padding:0 14px;outline:none;font-family:inherit}
.field.code{text-align:center;letter-spacing:.3em;text-transform:uppercase;font-size:24px}
.msg{min-height:20px;font-size:13.5px;color:var(--gold);text-align:center;margin-top:10px;line-height:1.35}
.msg.err{color:#ff8f7a}
.codebox{text-align:center;background:#0e1422;border:1px dashed rgba(255,207,74,.5);border-radius:14px;padding:8px 6px 10px}
.codebox small{display:block;color:var(--mut);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase}
.codebox b{font-size:30px;letter-spacing:.2em;color:var(--gold);font-weight:900;margin-left:.2em}
.codebox b.ip{font-size:21px;letter-spacing:.04em;margin-left:0}
/* ---- menú: inicio (solo con bots o en línea), preparar partida y elegir mapa ---- */
.screen.home{justify-content:flex-start;padding-top:calc(14px + var(--sat))}
.logo.sm{margin-top:1.5vh}
.logo.sm h1{font-size:40px}
.hwrap{width:100%;max-width:400px;margin-top:auto;display:flex;flex-direction:column;gap:9px;padding-top:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:16px;background:rgba(24,32,51,.94);border:1px solid var(--line)}
.seg button{height:44px;border-radius:12px;font-size:15px;font-weight:800;color:#c3cbdb;display:flex;align-items:center;justify-content:center;gap:8px;pointer-events:auto}
.seg button svg{width:20px;height:20px;flex:none}
.seg button.on{background:#f4ecd8;color:#141a2b;font-weight:900}
.seg button.on.gold{background:var(--gold);color:#2a1c02}
.seg.where button{height:50px;font-size:16px}
.hquick{display:flex;align-items:center;gap:14px;min-height:66px;border-radius:16px;padding:8px 16px;background:linear-gradient(180deg,#f0664a,#d7432a);border:1px solid #ff9a84;box-shadow:0 4px 0 #8e2a19;color:#fff;text-align:left;pointer-events:auto;margin-bottom:4px}
.hquick .pi{width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:none}
.hquick .pi svg{width:20px;height:20px}
.hquick b{display:block;font-size:20px;font-weight:900}
.hquick small{display:block;font-size:13px;font-weight:600;color:#ffe3da;margin-top:2px}
.hlbl{font-size:14.5px;font-weight:800;color:var(--ink);margin:6px 2px 0;text-align:left}
.hlbl small{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-top:1px}
.hlbl.rh{display:flex;align-items:center;justify-content:space-between}
.mlist{display:flex;flex-direction:column;gap:7px}
.mrow,.orow{display:flex;align-items:center;gap:12px;min-height:58px;border-radius:14px;padding:8px 12px;background:rgba(24,32,51,.95);border:1px solid var(--line);text-align:left;pointer-events:auto;width:100%;color:var(--ink)}
.mrow:active,.orow:active,.mtile:active,.mapc:active{transform:scale(.985)}
.mic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.mic svg{width:22px;height:22px}
.mic.sm{width:40px;height:40px;background:rgba(255,255,255,.06)}
.mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mt b{font-size:16.5px;font-weight:800}
.mt small{font-size:13px;color:#a9b3c8;line-height:1.3}
.mch{color:#7c879f;flex:none;display:flex}.mch svg{width:18px;height:18px}.mch.up svg{transform:rotate(180deg)}
.ochg{font-size:14px;font-weight:800;color:var(--gold);flex:none}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mtile{height:64px;border-radius:12px;background:rgba(24,32,51,.95);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;pointer-events:auto;color:var(--ink)}
.mtile svg{width:20px;height:20px}.mtile span{display:flex}
.mtile b{font-size:13px;font-weight:800}
.mtile.alt{background:transparent;border-style:dashed;border-color:rgba(255,255,255,.3);color:#c3cbdb}
.hfoot{margin-top:6px}.hfoot .btn{margin-top:0}
.home .rooms{max-height:180px}
.hpanel{display:flex;flex-direction:column;gap:9px;background:rgba(15,21,34,.94);border:1px solid var(--line);border-radius:18px;padding:12px}
.hpanel .hlbl:first-child{margin-top:0}
.hlbl{text-shadow:0 1px 3px rgba(0,0,0,.8)}
.home .msg:empty{display:none}
.who{font-size:13.5px;color:var(--mut);text-align:center;margin-top:14px}
.who b{color:var(--ink)}
.who .row .btn{width:auto;padding:0 16px}
.lnk{color:var(--gold);font-weight:800;text-decoration:underline;pointer-events:auto;font-size:13.5px}
.screen.prep,.screen.maps{padding:var(--sat) 0 0!important;overflow:hidden}
/* preparar y elegir mapa: arriba lo que se desplaza; abajo, aparte, los botones (nada queda debajo de ellos) */
.pscroll{flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;display:flex;flex-direction:column;align-items:center;padding:12px 16px 18px}
.phead{width:100%;max-width:400px;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.phead h2{text-align:left;margin:0;font-size:22px}
.phead small{display:block;font-size:13px;color:#a9b3c8;margin-top:1px;line-height:1.3}
.back2{width:44px;height:44px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:22px;font-weight:800;flex:none;pointer-events:auto}
.pbody{width:100%;max-width:400px;display:flex;flex-direction:column}
.pbody .hlbl{margin:16px 2px 8px}.pbody .hlbl:first-child{margin-top:0}
.pnote{font-size:12.5px;color:var(--mut);margin:7px 2px 0;line-height:1.35}
.mapcard{display:flex;gap:14px;align-items:center;border-radius:16px;background:var(--panel);border:1px solid var(--line);padding:10px;text-align:left}
.mthumb{width:96px;height:96px;border-radius:12px;object-fit:cover;image-rendering:pixelated;background:#22304c;flex:none;display:flex;align-items:center;justify-content:center;color:var(--gold)}
img.mthumb[src=""]{visibility:visible}
.mthumb.rnd svg{width:42px;height:42px}
.mi{display:flex;flex-direction:column;gap:5px;min-width:0}
.mi b{font-size:17px;font-weight:800;line-height:1.15}
.mi small{font-size:13px;color:#a9b3c8;line-height:1.3}
.zb{align-self:flex-start;font-size:11.5px;font-weight:800;color:#141a2b;background:#8cb0ff;border-radius:7px;padding:3px 8px}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.2);box-shadow:none;color:var(--ink)}
.btn.ghost2{background:transparent;border:0;box-shadow:none;color:#c3cbdb;margin-top:2px}
.ofold{margin-top:8px}
.pfoot{position:relative;flex:none;width:100%;max-width:432px;padding:10px 16px calc(12px + var(--sab));background:rgba(9,13,22,.97);z-index:2}
.pfoot::before{content:'';position:absolute;left:0;right:0;top:-18px;height:18px;background:linear-gradient(180deg,rgba(9,13,22,0),rgba(9,13,22,.97));pointer-events:none}
.pfoot .btn{margin-top:4px}
.tabs3 button{height:52px;flex-direction:column;gap:1px}
.tabs3 b{font-size:15px}.tabs3 small{font-size:11.5px;font-weight:600;opacity:.8}
.maps .seg{width:100%;max-width:400px}
.mapgrid{width:100%;max-width:400px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 4px}
.mapc{position:relative;border-radius:14px;background:var(--panel);border:2px solid transparent;padding:0 0 10px;overflow:hidden;text-align:left;display:flex;flex-direction:column;pointer-events:auto;color:var(--ink)}
.mapc .mthumb{width:100%;height:118px;border-radius:0}
.mapc b{font-size:15px;font-weight:800;margin:8px 10px 0}
.mapc small{font-size:12.5px;color:#a9b3c8;margin:2px 10px 0;line-height:1.25}
.mapc.on{border-color:var(--gold)}
.mapc.rnd{background:transparent;border:1px dashed rgba(255,255,255,.32)}
.mapc.rnd.on{border:2px solid var(--gold)}
.mapc .ck{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:13px;background:var(--gold);color:#2a1c02;display:flex;align-items:center;justify-content:center}
.mapc .ck svg{width:15px;height:15px}
.teams{display:flex;flex-wrap:wrap;margin:0 -4px}
.tm{width:calc(50% - 8px);margin:4px;border-radius:13px;background:var(--panel2);border-top:4px solid #888;padding:6px}
.tm h4{margin:0 0 4px;font-size:13px;font-weight:800;display:flex;justify-content:space-between}
.tm h4 small{font-weight:700;opacity:.9}
.slot{display:flex;align-items:center;height:34px;border-radius:9px;background:rgba(0,0,0,.25);margin-top:4px;padding:0 8px;font-size:13.5px;font-weight:700;pointer-events:auto;width:100%;text-align:left}
.slot .d{width:10px;height:10px;border-radius:50%;margin-right:7px;flex:none}
.slot.bot{color:var(--mut);font-weight:600}
.slot.me{outline:2px solid var(--gold)}
.slot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--panel2);border-radius:12px;padding:10px 12px;margin-top:6px;font-weight:700;pointer-events:auto}
.rank{width:100%}
.rank .r{display:flex;align-items:center;background:var(--panel2);border-radius:12px;padding:8px 10px;margin-top:6px;border-left:6px solid #888}
.rank .r b{font-size:20px;width:34px}
.rank .r span{flex:1;font-weight:800}
.rank .r small{color:var(--mut);font-size:12px;text-align:right;line-height:1.3}
.big{font-size:38px;font-weight:900;text-align:center;margin:8px 0 0;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.help p{margin:8px 0;font-size:14px;line-height:1.42}
.help b{color:var(--gold)}
.ic{display:inline-block;width:20px;height:20px;vertical-align:-4px}
.toggle{display:flex;align-items:center;justify-content:space-between;height:46px;border-bottom:1px solid var(--line);font-weight:700}
.toggle:last-child{border-bottom:0}
.sw{width:56px;height:32px;border-radius:16px;background:#0e1422;border:1px solid var(--line);position:relative;pointer-events:auto}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#59647c;transition:left .12s}
.sw.on{background:#2c6b3c}.sw.on:after{left:27px;background:#7dff9a}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
/* barra de abajo (objetivo + aviso): el juego y sus botones terminan donde empieza ella; nada queda encima del juego */
:root{--ibarH:52px}
#ibar{display:none;position:absolute;left:0;right:0;bottom:0;height:calc(var(--ibarH) + var(--sab));padding-bottom:var(--sab);box-sizing:border-box;background:#0b1020;border-top:1px solid rgba(255,255,255,.1);flex-direction:column;justify-content:center;pointer-events:none;z-index:3}
body.ibar #ibar{display:flex}
body.ibar #c,body.ibar #hud{height:calc(100% - var(--ibarH) - var(--sab))}
body.ibar #hud{--sab:0px}
body.party #ibar{display:none}
body.party.ibar #c,body.party.ibar #hud{height:100%}
#labels,#dmg{position:absolute;left:0;top:0;width:100%;height:100%}
.lb{position:absolute;left:0;top:0;width:64px;margin-left:-32px;text-align:center;will-change:transform}
.lb .nm{font-size:10.5px;font-weight:800;text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap;overflow:hidden}
.lb .hb{height:5px;border-radius:3px;background:rgba(0,0,0,.6);margin:1px 9px 0;overflow:hidden;border:1px solid rgba(0,0,0,.5)}
.lb .hb i{display:block;height:100%;background:#ff5d5d;border-radius:2px}
.lb .pw{display:flex;justify-content:center;gap:3px;margin-top:2px;height:7px}
.lb .pw:empty{display:none}
.lb .pw i{width:7px;height:7px;border-radius:50%;box-shadow:0 0 6px currentColor,0 0 2px #000}
.lb.ally .hb i{background:#5fe37f}
/* compañero o rival, de un vistazo: compañero con nombre verde y su número verde con flecha encima; rival con nombre rojo */
.lb.ally .nm,.lb.foe .nm{display:inline-block;max-width:100%;box-sizing:border-box;padding:0 5px;border-radius:7px;background:rgba(10,14,24,.55)}
.lb .an{position:absolute;left:50%;bottom:100%;width:22px;height:22px;margin:0 0 15px -13px;border-radius:50%;background:rgba(10,14,24,.88);border:2px solid #5fe37f;color:#5fe37f;font:900 13px/22px system-ui,sans-serif;text-align:center;box-shadow:0 1px 3px #000}
.lb .an::after{content:'';position:absolute;left:50%;top:100%;margin:2px 0 0 -9px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:11px solid #5fe37f;filter:drop-shadow(0 1px 1px #000)}
.lb.ally .scr{bottom:calc(100% + 40px)}
.tp .tn{display:inline-block;min-width:15px;height:15px;margin-right:5px;border-radius:50%;border:1.5px solid #5fe37f;color:#5fe37f;font:900 10px/15px system-ui,sans-serif;text-align:center;font-style:normal;vertical-align:1px}
.lb.me{width:104px;margin-left:-52px}
.lb.me .nm{font-size:11px}
.lb.me .hb{position:relative;height:10px;margin:2px 26px 0 6px;border:1.5px solid #000;border-radius:5px;background:rgba(0,0,0,.65);overflow:visible;box-shadow:0 0 0 1px rgba(255,255,255,.55)}
.lb.me .hb i{background:#fff;border-radius:3px;transition:background .2s}
.lb.me .hv{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:4px;font:900 11.5px/1 system-ui,sans-serif;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000}
.lb.me.mid .hb i{background:#ffb347}.lb.me.mid .hv{color:#ffc56b}
.lb.me.low .hb i{background:#ff4d4d;animation:lowb .5s ease-in-out infinite alternate}.lb.me.low .hv{color:#ff7a7a}
.lb.me.low .hb{box-shadow:0 0 0 1px #ff8a8a,0 0 8px rgba(255,60,60,.8)}
.lb.me.rg .hb{box-shadow:0 0 0 1px #9dffb3,0 0 9px rgba(95,227,127,.9)}
@keyframes lowb{from{opacity:1}to{opacity:.45}}
.tp.hmid .hb i{background:#ffb347!important}.tp.hlow .hb i{background:#ff4d4d!important}
#lowhp{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 44%,rgba(200,0,0,.46) 74%,rgba(160,0,0,.85) 100%);transition:opacity .25s}
#lowhp.beat{animation:lowbeat .62s ease-in-out infinite}
#lowhp::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:var(--cracks) center/100% 100% no-repeat;opacity:0;transition:opacity .3s}
#lowhp.crit{box-shadow:inset 0 0 0 100vmax rgba(120,0,0,.16)}
#lowhp.crit::after{opacity:1}
/* furia en pantalla: 20 % naranja suave · 40 % naranja fuerte · 70 % rojo con rayos · 100 % dorado con rayos rápidos */
#furyfx{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;opacity:0;overflow:hidden;transition:opacity .4s;--fc:255,170,60}
#furyfx::before{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:radial-gradient(ellipse at center,rgba(var(--fc),0) 44%,rgba(var(--fc),.42) 74%,rgba(var(--fc),.85) 100%);animation:fzp 1.1s ease-in-out infinite alternate}
#furyfx::after{content:"";position:absolute;left:-40%;top:-40%;width:180%;height:180%;background:repeating-conic-gradient(from 0deg,rgba(var(--fc),0) 0deg 6deg,rgba(var(--fc),.42) 7deg 9deg);-webkit-mask-image:radial-gradient(circle,transparent 30%,#000 62%);mask-image:radial-gradient(circle,transparent 30%,#000 62%);opacity:0;animation:fzr 9s linear infinite}
#furyfx i{position:absolute;left:0;top:0;right:0;bottom:0;background:radial-gradient(circle,rgba(255,245,200,0) 15%,rgba(255,225,130,.6) 100%);opacity:0}
#furyfx.f1{opacity:.6}
#furyfx.f2{opacity:.8;--fc:255,128,40}#furyfx.f2::after{opacity:.35}
#furyfx.f3{opacity:.9;--fc:255,80,50}#furyfx.f3::after{opacity:.65}
#furyfx.f4{opacity:1;--fc:255,212,80}#furyfx.f4::after{opacity:1;animation-duration:3.5s}#furyfx.f4::before{animation-duration:.55s}
#furyfx.burst{opacity:1}#furyfx.burst i{animation:fzb .7s ease-out}
@keyframes fzp{from{opacity:.7}to{opacity:1}}
@keyframes fzr{to{transform:rotate(360deg)}}
@keyframes fzb{0%{opacity:1}100%{opacity:0}}
@keyframes lowbeat{0%,100%{filter:brightness(1)}18%{filter:brightness(1.6)}36%{filter:brightness(1.05)}52%{filter:brightness(1.4)}}
.lb.mob .hb i{background:#ffa53d}.lb.mob .nm{font-size:10px}.lb.mob.big{width:84px;margin-left:-42px}.lb.mob.big .hb{height:7px}
.lb .st{font-size:10px;font-weight:800;color:#ffd0c7;text-shadow:0 1px 2px #000}
.lb.hunt{width:190px;margin-left:-95px}
.lb.item{width:120px;margin-left:-60px;font-size:10.5px;font-weight:700;color:#e7dcc5;text-shadow:0 1px 2px #000,0 0 3px #000;line-height:1.2}.lb.item b{font-size:11.5px}.lb.hunt .st{font-size:11.5px;font-weight:900;white-space:nowrap;animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.12)}}
#edge{position:absolute;left:0;top:0;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(13,18,30,.82);border:2px solid currentColor;will-change:transform}
#edge .rot{position:absolute;left:0;top:0;width:100%;height:100%}
/* compañeros fuera de la pantalla: círculo verde con su número y flecha hacia él */
#aedges{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.aedge{position:absolute;left:0;top:0;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(10,14,24,.85);border:2px solid #5fe37f;color:#5fe37f;will-change:transform}
.aedge.hide{display:none}
.aedge .rot{position:absolute;left:0;top:0;width:100%;height:100%}
.aedge .rot i{position:absolute;left:50%;top:-10px;margin-left:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:9px solid #5fe37f}
.aedge span{position:absolute;left:0;right:0;top:5px;text-align:center;font:900 15px/1 system-ui,sans-serif}
.aedge small{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:8.5px;font-weight:900;color:#fff}
body.mapbig #aedges,body.drop #aedges,body.party #aedges{display:none}
#edge .rot i{position:absolute;left:50%;top:-11px;margin-left:-8px;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:11px solid currentColor}
#edge .ic{position:absolute;left:11px;top:6px;width:26px;height:26px}#edge .ic svg{width:100%;height:100%}
#edge small{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:9.5px;font-weight:900;color:#fff}
#obj.both #oSol,#obj.both #oLuna{filter:drop-shadow(0 0 4px #ffe066)}
.dn{position:absolute;left:0;top:0;font-weight:900;font-size:15px;color:#fff;text-shadow:0 1px 0 #000,0 0 4px #000;animation:dn .7s ease-out forwards;will-change:transform,opacity}
.dn.big{font-size:20px;animation-duration:1.1s}
.dn.me{color:#ff6b5e;font-size:18px}.dn.mob{color:#ffd9a3;font-size:13px}.dn.heal{color:#7dff9a}.dn.pw{font-size:13px;animation-duration:1s}
@keyframes dn{0%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-34px}}
#top{position:absolute;left:8px;right:8px;top:8px;display:flex;align-items:flex-start;justify-content:space-between}
#team{width:36%;max-width:150px}
.tp{display:flex;align-items:center;background:rgba(13,18,30,.72);border-radius:9px;padding:4px 6px;margin-bottom:4px;border-left:4px solid #888}
.tp .n{flex:1;min-width:0}
.tp .n b{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tp .tl{display:flex;align-items:baseline;gap:4px}
.tp .tl b{flex:1}
.tp .tk{font-style:normal;font-size:10px;font-weight:900;color:#ffd76a;white-space:nowrap}

#mid{flex:1;text-align:center;padding:0 6px}

#pows i{font-style:normal;font-size:10.5px;font-weight:900;color:#10151f;border-radius:8px;padding:3px 7px;margin-right:4px;box-shadow:0 1px 3px rgba(0,0,0,.5)}
#pows{display:flex;align-items:center;flex-wrap:wrap;row-gap:4px}

/* tu tarjeta: arriba de la palanca, todo lo tuyo (o de a quien miras): vida grande con número y cuánto ganas o pierdes, estado y lo que llevas */

/* ---- de lado (celular horizontal), ordenado por zonas, nada encima de otra cosa ----
   arriba izq: compañeros y, debajo, tu tarjeta · arriba centro: reloj en dos renglones y la lista de lo que pasa ·
   arriba der: minimapa con sus tres botones debajo · abajo izq: palanca · abajo der: espada en la esquina, salto
   encima, estrella y las tres técnicas en fila a su izquierda · barra de abajo en un solo renglón */

#tick{display:none}
body.land #ibar{flex-direction:row;align-items:stretch}
body.land #obj{flex:1 1 36%;height:auto}
body.land #banner{flex:1 1 34%;height:auto;border-top:0;border-left:1px solid rgba(255,255,255,.1)}

body.kb #bSpPrev, body.kb #bSpNext{position:relative}
#mm[data-key]::after{left:auto;right:-4px;top:-4px}
@keyframes killp{from{transform:scale(1);box-shadow:0 0 6px #ffcf4a}to{transform:scale(1.08);box-shadow:0 0 22px #ffcf4a}}
#spect{position:absolute;left:50%;bottom:calc(8px + var(--sab));transform:translateX(-50%);width:max-content;max-width:92vw;text-align:center;font-size:12.5px;font-weight:800;background:rgba(13,18,30,.82);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.watch #spect{bottom:calc(22px + var(--sab));font-size:14px;padding:7px 16px}
#rot{position:absolute;left:0;top:0;width:100%;height:100%;z-index:60;background:#0b0f18;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:800;padding:24px}
.tip{font-size:12.5px;color:var(--ink);opacity:.85;text-align:center;margin-top:12px;line-height:1.35;background:rgba(13,18,30,.7);border-radius:10px;padding:8px 10px}
/* iPhone: respeta la muesca y la barra inferior cuando se abre desde la pantalla de inicio */
@supports (top: var(--sat)) {
  #top{top:calc(8px + var(--sat))}

  #feed{top:calc(164px + var(--sat))}
  #btns{bottom:var(--sab)}
  #joy{bottom:var(--sab)}
  .screen{padding-top:calc(18px + var(--sat));padding-bottom:calc(22px + var(--sab))}
  .back{top:calc(10px + var(--sat))}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div id="lowhp"></div>
  <div id="furyfx"><i></i></div>
  <div id="ins" class="hide"><div class="bagH"><b>Jugadores</b><button class="bagX" aria-label="Cerrar">✕</button></div><div id="insL"></div></div>
  <div id="bag" class="hide"><div class="bagH"><b>Mochila</b><button class="bagX" aria-label="Cerrar">✕</button></div><div id="bagL"></div><div class="bagN">Lo que sueltes queda a tus pies: un compañero lo toma al pasar (un rival también). Tú no lo vuelves a tomar hasta que te alejes.</div></div>
  <div id="labels"></div>
  <div id="vig"></div>
  <div id="hurt"></div>
  <div id="dmg"></div>
  <div id="top">
    <div id="team"></div>
    <div id="mid">
      <div id="phase">CACERÍA</div>
      <div id="clock">1:30</div>
      <div id="clockSub"></div>
      <div id="alive"></div>
    </div>
    <div id="mm" data-key="M">
      <canvas id="mini" width="208" height="208"></canvas>
      <div id="mmCap">Elige dónde caer</div>
      <button id="mmX" aria-label="Cerrar mapa">✕</button>
      <div id="ping"></div>
      <button id="bMenu" data-key="Esc">II</button>
      <button id="bBag" aria-label="Mochila" data-key="Q">🎒</button>
      <button id="bIns" aria-label="Jugadores" data-key="Tab">👥</button>
    </div>
  </div>
  <div id="me" style="display:none"><div class="mN"></div><div class="mH"><div class="mB"><i></i></div><b class="mV"></b><span class="mD"></span></div><div class="mS"></div><div id="pows"></div></div>
  <div id="edge" class="hide"></div>
  <div id="feed"></div>
  <div id="deliver" class="hide"><span></span><div class="bar"><i></i></div></div>
  <div id="downed" class="hide"></div>
  <button id="bRefall" class="hide" data-key="R">Volver a caer</button>
  <div id="specBar"><button id="bSpPrev" data-key="←">‹</button><div id="specTxt">Espectador</div><button id="bSpNext" data-key="→">›</button></div>
  <div id="stale" class="hide">Esperando al anfitrión…</div>
  <div id="spect" class="hide"></div>
  <button id="bSpKill" class="hide"></button>
  <button id="bSpScroll" class="hide"></button>
  <div id="ghost" class="hide"><button id="bGhPing">🗿 ¡Recojan mi tótem!</button><button id="bGhPush"></button></div>
  <div id="eyeIn" class="hide"></div>
  <div id="count" class="hide"></div>
  <button id="bDive" class="hide" data-key="Espacio">PICADA</button>
  <div id="joy"><div id="joyB"><div id="joyK"></div></div></div>
  <div id="btns">
    <button class="ab" id="bSpec" data-act="special" data-key="1"></button>
    <button class="ab" id="bSpecA" data-act="special2" data-key="2"></button>
    <button class="ab" id="bSpecL" data-act="special3" data-key="3"></button>
    <button class="ab" id="bDash" data-act="dash" data-key="Espacio"></button>
    <button class="ab" id="bShur" data-act="shuriken" data-key="Clic der."></button>
    <button class="ab" id="bMelee" data-act="melee" data-key="Clic"></button>
    <!-- el remate es automático: el botón ya no se muestra -->
    <button class="ab off" id="bKill" data-act="remate" data-key="F" style="display:none"><b>REMATE</b></button>
    <button class="ab hide" id="bBurn" data-act="burn" data-key="B"><i></i><b>FURIA</b></button>
    <button class="ab hide" id="bCarry" data-act="carry" data-key="E"><b>CARGAR</b></button>
  </div>
</div>
<!-- abajo del todo, fuera del juego: el objetivo y, debajo, el aviso del momento -->
<div id="ibar"><div id="obj"></div><div id="banner"></div><div id="tick"></div></div>

<div id="ui"></div>
<div id="flash" style="position:absolute;left:0;top:0;width:100%;height:100%;background:#eaf2ff;opacity:0;pointer-events:none;z-index:5"></div>
<div id="rot" class="hide">Gira el teléfono<br>para jugar en vertical</div>
<script src="game.js"></script>
</body>
</html>
